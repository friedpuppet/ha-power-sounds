[project]
name = "ha-power-sounds"
version = "0.1.3"
description = "Home Assistant integration: sounds on grid loss and return and on battery levels"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.357",  # = Home Assistant 2026.8.3
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
